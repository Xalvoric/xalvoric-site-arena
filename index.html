<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xalvoric | Websites, AI agents and product ads</title>
    <meta
      name="description"
      content="Xalvoric is a digital studio for website development, AI agents and automation, and AI-assisted product ad generation."
    />
    <meta name="theme-color" content="#050505" />
    <style>
      html,
      body {
        margin: 0;
        background: #050505;
        color: #f3f3f1;
      }
    </style>
    <script>
      // Decide the Services layout before first paint, so nothing reflows and a reload halfway down the
      // page lands in the right place. Reduced motion (or ?motion=off) keeps the plain, complete layout.
      // If the app script never starts, fall back to that layout after 8 s so no content stays hidden.
      ;(function () {
        var d = document.documentElement
        if (matchMedia('(prefers-reduced-motion: reduce)').matches || /[?&]motion=off/.test(location.search)) return
        d.dataset.svc = 'motion'
        setTimeout(function () {
          if (!d.dataset.svcLive) delete d.dataset.svc
        }, 8000)
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" href="/media/beat1-establish-1280.webp" type="image/webp" fetchpriority="high" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Xalvoric | Websites, AI agents and product ads" />
    <meta
      property="og:description"
      content="Website development, AI agency and ad generation, built by one studio."
    />
    <meta property="og:image" content="/media/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

    <div id="root"></div>
    <noscript>

        Xalvoric builds websites, AI agents and automations, and product ad creative. Please enable JavaScript for
        the full site.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
